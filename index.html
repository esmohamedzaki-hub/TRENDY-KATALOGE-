<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شركة التسويق العقاري | وحدات سياحية وسكنية</title>
<meta name="description" content="تسويق وبيع الوحدات السياحية والسكنية أونلاين بخطط سداد واضحة.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f7f3ea;--surface:#fffdf8;--ink:#0d2b33;--muted:#4f6a70;--brand:#0f5f6b;--brand-ink:#fff;--accent:#e2623a;--line:#e3dccb;--wa:#1faa59;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1d22;--surface:#12292f;--ink:#f1ece0;--muted:#a9bec2;--brand:#47b6c4;--brand-ink:#06242a;--accent:#ff8a63;--line:#25424a}}
:root[data-theme="dark"]{--bg:#0b1d22;--surface:#12292f;--ink:#f1ece0;--muted:#a9bec2;--brand:#47b6c4;--brand-ink:#06242a;--accent:#ff8a63;--line:#25424a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.8}
:lang(ar){font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-size:18px}
:lang(en){font-family:"Manrope","Segoe UI",Arial,sans-serif;line-height:1.65;letter-spacing:-.005em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
a{color:inherit}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{line-height:1.3;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,4vw,2.3rem);font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 1em}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.8em 1.4em;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:600}
.btn:focus-visible,.lang:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.08)}
.btn-line{border-color:var(--brand);color:var(--brand)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{font-weight:800;font-size:1.15rem;color:var(--brand);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo svg{width:30px;height:30px}
nav{display:none;gap:22px}
nav a{text-decoration:none;font-weight:600;color:var(--muted)}
nav a:hover{color:var(--brand)}
.tools{display:flex;gap:10px;align-items:center}
.lang{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:.35em 1em;cursor:pointer;font-weight:600;font:inherit;font-weight:600}
@media(min-width:860px){nav{display:flex}}
.hero{padding-block:64px 56px;position:relative;overflow:hidden}
.hero .wrap{display:grid;gap:36px}
.eyebrow{display:inline-block;color:var(--accent);font-weight:800;margin-bottom:10px}
.hero p.lead{font-size:1.15em;color:var(--muted);max-width:34em}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.panel{background:var(--brand);color:var(--brand-ink);border-radius:28px;padding:28px;position:relative;overflow:hidden}
.panel h3{font-size:1.3rem}
.panel ul{list-style:none;padding:0;margin:0}
.panel li{padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--brand-ink) 25%,transparent)}
.panel li:last-child{border:0}
.waves{position:absolute;inset-inline:0;bottom:-6px;width:100%;height:60px;opacity:.18}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.2fr .8fr;align-items:center}}
section{padding-block:56px}
.alt{background:var(--surface);border-block:1px solid var(--line)}
.grid{display:grid;gap:18px}
@media(min-width:700px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.alt .card{background:var(--bg)}
.num{font-weight:800;color:var(--accent);font-size:1.6rem;display:block}
.sub{color:var(--muted);max-width:40em}
.proj{display:grid;gap:24px}
@media(min-width:860px){.proj{grid-template-columns:1fr 1fr}}
.tag{display:inline-block;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-radius:999px;padding:.1em .8em;font-weight:600;font-size:.85em}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:320px}
th,td{padding:12px 10px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.note{font-size:.85em;color:var(--muted)}
.final{background:var(--brand);color:var(--brand-ink);text-align:center;border-radius:28px;padding:44px 20px}
.final .btn-wa{font-size:1.1em}
footer{padding-block:36px 110px;border-top:1px solid var(--line);color:var(--muted)}
.fgrid{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>

<section id="services" class="alt"><div class="wrap">

     <tbody><tr><td data-i18n="u1"></td><td dir="ltr" style="text-align:start"><bdi>72 m²</bdi></td></tr><tr><td data-i18n="u2"></td><td dir="ltr" style="text-align:start"><bdi>100 m²</bdi></td></tr></tbody></table></div></div>
  </div>

   <a class="btn btn-wa" data-wa data-msg="proj" href="#" target="_blank" rel="noopener" data-i18n="cta3"></a>
  </div>
 </div>
</div></section>

<section id="process" class="alt"><div class="wrap">

  <div class="card"><span class="num">3</span><h3 data-i18n="st3t"></h3><p data-i18n="st3d"></p></div>
 </div>
</div></section>

<section id="contact"><div class="wrap"><div class="final">

 <a class="btn btn-wa" data-wa href="#" target="_blank" rel="noopener" data-i18n="cta"></a>
</div></div></section>
</main>

<footer><div class="wrap fgrid">
